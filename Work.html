<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Work — agenticbuilders</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<script>

<style>
  :root {
    --bg: #0a0a0a; --bg-1: #0f0f0f; --bg-2: #141414; --bg-3: #1a1a1a;
    --line: #1f1f1f; --line-2: #2a2a2a;
    --fg: #f4f1ec; --fg-2: #b8b3aa; --fg-3: #76726b; --fg-4: #4a4742;
    --accent: #ff7a1a; --accent-soft: rgba(255, 122, 26, 0.12);
    --light-bg: #f1ede5; --light-fg: #1a1a1a;
    --serif: "Instrument Serif", "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sans: "Inter", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }
  .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 80px 80px; pointer-events: none; }
  .eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); display: inline-flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ""; width: 6px; height: 6px; background: var(--accent); display: inline-block; }
  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: var(--mono); }
  nav.topbar { position: sticky; top: 0; z-index: 50; background: rgba(10,10,10,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  nav.topbar .inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; max-width: 1440px; margin: 0 auto; }
  .logo { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; display: inline-flex; align-items: center; gap: 10px; }
  .logo-mark { width: 18px; height: 18px; background: var(--accent); display: inline-block; position: relative; }
  .logo-mark::after { content: ""; position: absolute; inset: 4px; background: var(--bg); }
  .nav-links { display: flex; gap: 28px; font-family: var(--mono); font-size: 12px; color: var(--fg-2); }
  .nav-links a { transition: color .2s; }
  .nav-links a:hover { color: var(--fg); }
  .nav-cta { font-family: var(--mono); font-size: 12px; background: var(--fg); color: var(--bg); padding: 9px 16px; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .2s; }
  .nav-cta:hover { background: var(--accent); color: #0a0a0a; }
  .nav-cta::after { content: "→"; }
  .status { font-family: var(--mono); font-size: 11px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border: 1px solid var(--line-2); border-radius: 999px; }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.5); } 70% { box-shadow: 0 0 0 6px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
  ::selection { background: var(--accent); color: #0a0a0a; }
  .cta-primary { background: var(--accent); color: #1a0f00; border: 0; padding: 14px 22px; font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; gap: 14px; transition: transform .2s, box-shadow .2s; }
  .cta-primary:hover { box-shadow: 0 0 30px 0 var(--accent-soft), 0 0 0 1px var(--accent); transform: translateY(-1px); }
  .cta-primary .arr { transition: transform .2s; }
  .cta-primary:hover .arr { transform: translateX(4px); }
  .cta-primary.big { padding: 18px 28px; font-size: 14px; }
  .section-title { font-size: clamp(40px, 5.4vw, 76px); line-height: 1; margin: 18px 0 22px; letter-spacing: -0.02em; font-family: var(--serif); }
  .section-title .ital { color: var(--accent); font-style: italic; }
  .proc-head { max-width: 720px; margin-bottom: 60px; }
  /* footer styles (shared) */
  .footer { padding: 90px 0 28px; border-top: 1px solid var(--line); background: #060606; position: relative; overflow: hidden; }
  .foot-top { display: grid; grid-template-columns: 1fr 2fr; gap: 60px; padding-bottom: 70px; border-bottom: 1px solid var(--line); }
  .foot-brand { display: flex; gap: 14px; align-items: start; }
  .logo-mark.big { width: 22px; height: 22px; margin-top: 4px; }
  .foot-name { font-size: 28px; letter-spacing: -0.01em; font-family: var(--serif); }
  .foot-tag { font-size: 11px; color: var(--fg-3); margin-top: 4px; }
  .foot-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .foot-cols > div { display: flex; flex-direction: column; gap: 10px; }
  .foot-h { font-size: 11px; color: var(--fg-3); letter-spacing: 0.1em; margin-bottom: 8px; }
  .foot-cols a { color: var(--fg-2); font-size: 14px; transition: color .2s; }
  .foot-cols a:hover { color: var(--accent); }
  .foot-bigword { font-size: clamp(80px, 18vw, 280px); line-height: 0.85; letter-spacing: -0.04em; color: transparent; -webkit-text-stroke: 1px var(--line-2); margin: 60px 0 40px; user-select: none; font-family: var(--serif); }
  .foot-bottom { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-top: 28px; border-top: 1px solid var(--line); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; font-family: var(--mono); }
  @media (max-width: 1100px) { .foot-top { grid-template-columns: 1fr; } .foot-cols { grid-template-columns: 1fr 1fr; } }
  .loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: var(--mono); color: var(--fg-3); font-size: 12px; }
</style>
</head>
<body>
<div id="root"><div class="loading">$ loading work_</div></div>
