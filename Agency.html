<head>

<script>

<style>
  :root {
    --bg: #0a0a0a;
    --bg-1: #0f0f0f;
    --bg-2: #141414;
    --bg-3: #1a1a1a;
    --line: #1f1f1f;
    --line-2: #2a2a2a;
    --fg: #f4f1ec;
    --fg-2: #b8b3aa;
    --fg-3: #76726b;
    --fg-4: #4a4742;
    --accent: #ff7a1a;
    --accent-soft: rgba(255, 122, 26, 0.12);
    --light-bg: #f1ede5;
    --light-fg: #1a1a1a;
    --serif: "Instrument Serif", "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sans: "Inter", -apple-system, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* layout helpers */
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-3);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before {
    content: "";
    width: 6px; height: 6px;
    background: var(--accent);
    display: inline-block;
  }

  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: var(--mono); }

  .hairline { height: 1px; background: var(--line); border: 0; }

  /* nav */
  nav.topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,10,10,0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  nav.topbar .inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
    max-width: 1440px; margin: 0 auto;
  }
  .logo {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .logo-mark {
    width: 18px; height: 18px;
    background: var(--accent);
    display: inline-block;
    position: relative;
  }
  .logo-mark::after {
    content: "";
    position: absolute; inset: 4px;
    background: var(--bg);
  }
  .nav-links {
    display: flex; gap: 28px;
    font-family: var(--mono); font-size: 12px;
    color: var(--fg-2);
  }
  .nav-links a { transition: color .2s; }
  .nav-links a:hover { color: var(--fg); }
  .nav-cta {
    font-family: var(--mono); font-size: 12px;
    background: var(--fg); color: var(--bg);
    padding: 9px 16px;
    border: 0;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .2s;
  }
  .nav-cta:hover { background: var(--accent); color: #0a0a0a; }
  .nav-cta::after { content: "→"; }

  /* status pill */
  .status {
    font-family: var(--mono); font-size: 11px;
    color: var(--fg-2);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 10px;
    border: 1px solid var(--line-2);
    border-radius: 999px;
  }
  .status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 0 rgba(74,222,128,.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,.5); }
    70% { box-shadow: 0 0 0 6px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  /* generic */
  ::selection { background: var(--accent); color: #0a0a0a; }
  .root-container { position: relative; }

  /* placeholder spinner */
  .loading {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); color: var(--fg-3); font-size: 12px;
  }
</style>
</head>
<body>

<div id="root" class="root-container">
  <div class="loading">$ booting neuralynk_<span id="cursor">█</span></div>
</div>
